name: Build and type-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "nexus/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev --no-package-lock
      - run: npm run build
